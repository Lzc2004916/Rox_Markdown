<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- iOS standalone / home screen app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Markdown Card" />
    <title>Markdown Card — Rich Text Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      异步加载 Google Fonts — 不阻塞首屏渲染（splash）。
      国内用户无法访问 Google 服务时，浏览器使用系统回退字体，不会白屏等待。
    -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!--
      ═══════════════════════════════════════════════════════════════════════════
      Splash Screen — Renders instantly before Vue/JS boots.
      Vue's app.mount('#app') replaces this content naturally on initialization.
      Displays a centered loading GIF while the app initializes.
      Styles are externalized to src/splash.css (inline <style> triggers a flaky
      Vite html-inline-proxy bug with vite-plugin-electron multi-build).
      ═══════════════════════════════════════════════════════════════════════════
    -->
    <link rel="stylesheet" href="/src/splash.css" />

    <!--
      Theme detection — runs before first paint to avoid flash of wrong theme.
      Checks localStorage first, then system preference.
    -->
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        // 记录页面加载时间戳，供 main.ts 计算 splash 已显示时长
        window.__SPLASH_START__ = Date.now();
      })();
    </script>
  </head>

  <body>
    <!--
      ═══════════════════════════════════════════════════════════════════════════
      #app — Vue mounts here, replacing the splash screen on initialization.
      The splash renders instantly as static HTML; zero JS required.
      ═══════════════════════════════════════════════════════════════════════════
    -->
    <div id="app">
      <div class="splash" role="status" aria-label="Application loading">
        <div style="display: flex; flex-direction: column; align-items: center;">
          <img
            class="splash-loading-gif"
            src="/loading/createLoading.gif"
            alt="Loading"
            loading="eager"
            fetchpriority="high"
          />
          <p class="splash-loading-text">不要着急。。。你不是吉吉国王</p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
